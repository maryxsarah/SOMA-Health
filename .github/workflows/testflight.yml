name: TestFlight on merge to main

# Every merge/push to main builds a Release archive and uploads it to
# TestFlight, then commits the incremented build number back to main.
# Runs entirely on GitHub-hosted macOS runners (macos-26 ships Xcode 26.6) --
# no local machine involved. Secrets come from repo Settings -> Secrets and
# variables -> Actions (set them with scripts/gh-set-secrets.sh).

on:
  push:
    branches: [main]

# Serialize runs: build numbers must not race, and an in-flight upload must
# never be cancelled by a newer push.
concurrency:
  group: testflight-main
  cancel-in-progress: false

permissions:
  contents: write # to push the build-number bump back to main

jobs:
  testflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Materialize secrets (xcconfig + App Store Connect API key)
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          SUPERWALL_API_KEY: ${{ secrets.SUPERWALL_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # Debug and Release use the same values; write both.
          printf 'SUPABASE_HOST = %s\nSUPABASE_ANON_KEY = %s\nWHOOP_CLIENT_ID = %s\nOURA_CLIENT_ID = %s\nSUPERWALL_API_KEY = %s\n' \
            "$SUPABASE_HOST" "$SUPABASE_ANON_KEY" "$WHOOP_CLIENT_ID" "$OURA_CLIENT_ID" "$SUPERWALL_API_KEY" \
            | tee Config/Config-Debug.xcconfig > Config/Config-Release.xcconfig
          # Decode the .p8 signing key (tolerate any whitespace/line-wrapping).
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEYFILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYFILE" 2>/dev/null \
            || printf '%s' "$ASC_KEY_P8_BASE64" | tr -d '[:space:]' | base64 -D > "$KEYFILE"
          echo "decoded key: $(wc -c < "$KEYFILE") bytes, sha256 $(shasum -a 256 "$KEYFILE" | awk '{print $1}')"
          echo "expected sha256 5521d0777dbd2f6b0ca01c43a9ebba64cf93b76e7dc5085a90370b88aa15b004"
          echo "first line: $(head -1 "$KEYFILE")"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEYFILE"; then
            echo "::error::Decoded .p8 is not a valid PEM -- the ASC_KEY_P8_BASE64 secret is corrupted."
            exit 1
          fi
          # Credentials file consumed by scripts/testflight.sh.
          printf 'ASC_KEY_ID=%s\nASC_ISSUER_ID=%s\nASC_KEY_PATH=%s\n' \
            "$ASC_KEY_ID" "$ASC_ISSUER_ID" \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            > scripts/asc-api.env

      - name: Build and upload to TestFlight
        run: scripts/testflight.sh

      - name: Commit build-number bump back to main
        run: |
          set -euo pipefail
          NEXT="$(grep -E '^[[:space:]]*CFBundleVersion:' project.yml | grep -oE '[0-9]+' | head -1)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.yml
          if git diff --cached --quiet; then
            echo "No build-number change to commit."
          else
            # [skip ci] stops this bump commit from re-triggering the workflow.
            git commit -m "Bump build number to $NEXT for TestFlight upload [skip ci]"
            git push origin HEAD:main
          fi
