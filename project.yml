name: Soma
options:
  bundleIdPrefix: com.skollnitzer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.skollnitzer.soma
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: true
    # Pinned so `xcodegen generate` doesn't wipe your Team every time --
    # XcodeGen fully regenerates project.pbxproj from this file, so any
    # signing setting made only through Xcode's UI (not here) is lost on
    # the next regenerate. If you change Apple Developer teams, update
    # this value (or re-set it in Xcode and copy it back here).
    DEVELOPMENT_TEAM: G52G32NA32
    CODE_SIGN_STYLE: Automatic

packages:
  # Firebase (Analytics/Core only -- no other Firebase product is used).
  # `from:` maps to SwiftPM's .upToNextMajor(from:) -- pinned to the current
  # major (12.x, as of this writing) so it can pick up any 12.x point
  # release but won't silently jump to a future breaking major. Bump this
  # deliberately when you want to move to 13.x.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  # PostHog -- pinned to current major (3.x) for the same reason as Firebase
  # above.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.0.0
  # Superwall -- remote-configurable paywalls. Pinned to current major
  # (4.x) for the same reason as Firebase/PostHog above.
  Superwall:
    url: https://github.com/superwall/Superwall-iOS
    from: 4.0.0
  # Snapshot testing (SomaSnapshotTests only -- never linked into the app).
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0

targets:
  Soma:
    type: application
    platform: iOS
    sources:
      - path: Soma
        excludes:
          - "Soma.storekit"
      # Kept as a project file reference (so Xcode's scheme editor can find
      # it under Run -> Options -> StoreKit Configuration) but with no
      # build phase, so it's never copied into the app bundle -- it's a
      # dev-time-only test config, not something that should ship.
      - path: Soma/Soma.storekit
        buildPhase: none
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCore
      - package: PostHog
        product: PostHog
      - package: Superwall
        product: SuperwallKit
    info:
      path: Soma/Resources/Info.plist
      # XcodeGen regenerates this file from these properties on every
      # `xcodegen generate` run -- it does NOT preserve hand-edits made
      # directly to Info.plist, so all custom keys must live here.
      properties:
        CFBundleShortVersionString: "1.0"
        # Bump this before every new archive you upload to App Store
        # Connect -- Apple rejects re-uploading the same build number
        # under the same version, even for internal/bug-fix changes.
        CFBundleVersion: "15"
        # Declares Soma only uses exempt encryption (standard HTTPS via
        # URLSession -- no bundled/custom crypto) so every future archive
        # skips the "Missing Compliance" App Store Connect dialog
        # entirely, instead of having to answer it by hand each time.
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        # Explicit language list so the per-app language override in
        # iOS Settings (Settings -> Soma -> Language) shows all shipped
        # languages even though only en has UI chrome (LaunchScreen etc).
        CFBundleLocalizations:
          - en
          - es
          - fr
          - it
          - de
          - ru
          - ka
          - hy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Apple now requires either all 4 orientations (for iPad
        # multitasking) or an explicit opt-out via UIRequiresFullScreen --
        # Soma is a portrait-only phone app by design, so opt out rather
        # than add rotation support that was never part of the spec.
        UIRequiresFullScreen: true
        # HealthKit read-permission usage strings (spec requires both keys
        # even though Soma never writes health data).
        NSHealthShareUsageDescription: "Soma reads your sleep, heart rate, HRV, and activity data to tell you how hard to train each day."
        NSHealthUpdateUsageDescription: "Soma does not write to Health, but iOS requires this description alongside read access."
        # Camera access for the gym-photo-workout feature (photograph your
        # gym/equipment to get a matched workout). Note: choosing from the
        # library uses PhotosPicker, which needs no usage-description key
        # (it runs out-of-process and never grants the app broad library
        # access).
        NSCameraUsageDescription: "Soma uses your camera to see what gym equipment is available so it can build a matching workout."
        # Background Modes: "fetch" is what BGAppRefreshTaskRequest relies
        # on; "processing" matches the Xcode capability checklist in the spec.
        UIBackgroundModes:
          - fetch
          - processing
        # Must match BackgroundTaskManager / Config.backgroundTaskIdentifier.
        BGTaskSchedulerPermittedIdentifiers:
          - com.soma.app.refresh
        # OAuth callback scheme for Whoop/Oura via ASWebAuthenticationSession.
        CFBundleURLTypes:
          - CFBundleURLName: com.soma.app.oauth
            CFBundleURLSchemes:
              - soma
        # Environment config, populated via xcconfig ($(VAR) substitution).
        # Read at runtime by Soma/App/Config.swift.
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        WHOOP_CLIENT_ID: $(WHOOP_CLIENT_ID)
        OURA_CLIENT_ID: $(OURA_CLIENT_ID)
        POSTHOG_API_KEY: $(POSTHOG_API_KEY)
        POSTHOG_HOST: $(POSTHOG_HOST)
        SUPERWALL_API_KEY: $(SUPERWALL_API_KEY)
    entitlements:
      path: Soma/Resources/Soma.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin:
          - Default
    # `configFiles` (not `settings.configs.<name>.xcconfig`, which silently
    # creates a meaningless literal build setting named "xcconfig" instead
    # of attaching the file) is XcodeGen's actual key for wiring a real
    # baseConfigurationReference per build configuration.
    configFiles:
      Debug: Config/Config-Debug.xcconfig
      Release: Config/Config-Release.xcconfig
    # NOTE: this generates the entitlements file with the right keys and
    # points CODE_SIGN_ENTITLEMENTS at it, but it does NOT register the
    # capabilities on your App ID in the Apple Developer portal -- that
    # still requires opening Signing & Capabilities in Xcode once and
    # adding HealthKit, Background Modes, and Sign in with Apple via the
    # "+ Capability" button (with automatic signing on) so Xcode can
    # provision them for your Team. See SETUP.md.

  # Unit tests for the pure, non-UI logic that decisions actually hang on --
  # sleep aggregation, metric medians, and the models the Edge Functions
  # decode into. Anything needing a live HKHealthStore or network is out of
  # scope here; the server-side decision logic is covered separately by
  # `deno test supabase/functions/`.
  #
  # Run: xcodebuild test -project Soma.xcodeproj -scheme Soma \
  #        -destination 'platform=iOS Simulator,name=iPhone 16'
  SomaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Soma
    settings:
      base:
        # The host app carries the real bundle id; the test bundle needs its
        # own, or both get com.skollnitzer.soma from the project-level
        # setting and the test bundle fails to install.
        PRODUCT_BUNDLE_IDENTIFIER: com.skollnitzer.soma.tests
        GENERATE_INFOPLIST_FILE: true

  # Screen-state snapshot tests for the sport-goals feature (see
  # UITests/CASES.md for the case registry). Reference PNGs live in
  # SnapshotTests/__Snapshots__/ and are pinned to iPhone 17 Pro / iOS 26.5.
  # Run: scripts/test.sh snapshot   (record: scripts/test.sh snapshot --record)
  SomaSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SnapshotTests
    dependencies:
      - target: Soma
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skollnitzer.soma.snapshottests
        GENERATE_INFOPLIST_FILE: true

  # XCUITest journeys against a stubbed network (UITestSupport.swift serves
  # PostgREST-wire fixtures inside the app, DEBUG only). Case registry and
  # scenario map: UITests/CASES.md. Run: scripts/test.sh ui
  SomaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - "CASES.md"
          - "*.xctestplan"
    dependencies:
      - target: Soma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skollnitzer.soma.uitests
        GENERATE_INFOPLIST_FILE: true

# Explicit scheme -- without this block, this XcodeGen version does not
# auto-generate one, so Xcode's Run button (and a physical device target)
# has nothing to build against and shows "No scheme".
schemes:
  Soma:
    build:
      targets:
        Soma: all
        SomaTests: [test]
    # Without this the scheme builds the test bundle but never runs it, so
    # `xcodebuild test` reports success having executed nothing.
    test:
      config: Debug
      targets:
        - SomaTests
    run:
      config: Debug
      # Without this, the scheme has no StoreKit Configuration set (this
      # key isn't preserved across `xcodegen generate` -- adding the
      # explicit `schemes:` block above to fix "No scheme" silently wiped
      # out the one previously set by hand in Xcode's UI), so
      # Product.products(for:) queries the real App Store instead of the
      # local test config and finds nothing -- "Subscription products not
      # found" even though Soma.storekit is correctly set up.
      storeKitConfiguration: Soma/Soma.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Separate schemes so the slow layers never piggyback on a plain
  # `xcodebuild test -scheme Soma` (units stay the fast default).
  SomaSnapshotTests:
    build:
      targets:
        Soma: all
        SomaSnapshotTests: [test]
    test:
      config: Debug
      targets:
        - SomaSnapshotTests
    run:
      config: Debug

  SomaUITests:
    build:
      targets:
        Soma: all
        SomaUITests: [test]
    test:
      config: Debug
      targets:
        - SomaUITests
      # Screenshots-only capture: Xcode's default per-test screen RECORDING
      # slowly exhausts simulator memory over a 14-launch suite, and the OS
      # starts SIGKILLing the app mid-test (then relaunches it WITHOUT the
      # fixture launch args -- the "assert failures" that follow are noise).
      testPlans:
        - path: UITests/SomaUITests.xctestplan
          defaultPlan: true
    run:
      config: Debug
